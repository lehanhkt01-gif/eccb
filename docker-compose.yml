# ==============================================================================
# E-CCB EA SÚP — DOCKER COMPOSE CONFIGURATION
# Kiến trúc 4 Services độc lập, bảo mật nội bộ và tối ưu hiệu năng
# Hệ sinh thái Ea Súp Số — Domain: ccb.easupso.com
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. SERVICE APP: Ứng dụng Next.js 15 (Chạy cổng nội bộ 3000)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eccb_app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - SITE_URL=${SITE_URL:-https://ccb.easupso.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # 2. SERVICE DB: Cơ sở dữ liệu PostgreSQL 16 Alpine
  # Chú ý: TUYỆT ĐỐI KHÔNG mở cổng 5432 ra bên ngoài host, chỉ truy cập nội bộ
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eccb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eccb_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-eccb_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eccb_admin} -d ${DB_NAME:-eccb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. SERVICE NGINX: Reverse Proxy đón domain ccb.easupso.com
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: eccb_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # 4. SERVICE DOZZLE: Web UI giám sát log realtime nhẹ và bảo mật
  # ----------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: eccb_dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
    networks:
      - internal_net

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS CÔ LẬP
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: eccb_postgres_data

networks:
  internal_net:
    name: eccb_internal_net
    driver: bridge
