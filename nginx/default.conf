# ==============================================================================
# E-CCB EA SÚP — NGINX REVERSE PROXY CONFIGURATION
# Cổng đón chính thức: ccb.easupso.com -> app:3000
# ==============================================================================

upstream nextjs_upstream {
    server app:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ccb.easupso.com www.ccb.easupso.com localhost;

    # Kích thước tải lên tối đa (tài liệu, ảnh thẻ hội viên cựu chiến binh)
    client_max_body_size 25M;

    # Nén Gzip tối ưu tốc độ tải trên mạng di động 4G vùng biên giới Ea Súp
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers cơ bản
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static caching cho tài nguyên tĩnh của Next.js
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets từ thư mục public
    location /public/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # Định tuyến toàn bộ request về ứng dụng Next.js App Router
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Hot Reload support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint cho Nginx
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
